# openagentic 控制面策略——改这里调整后端分层与升级行为，不用动代码
version: 1

# 后端分层：哪些端点算"本地"（走受限配额），哪些走云端配额
tiers:
  local:
    gate_category: llm_local      # 对齐 vLLM max_num_seqs，见 OPENAGENTIC_GATE_LLM_LOCAL_CONCURRENCY
    concurrency: 2
    endpoints:
      - "127.0.0.1:9997"
      - "localhost:9997"
  cloud:
    gate_category: llm
    concurrency: 30

# 本地不可用时的升级目标（暂未启用，等 modeld 的 ensure 接进来再开）
escalation:
  enabled: true
  # 留空时读取根目录 openagentic.yaml 的 models.default
  target_model: ""

# System-1 验证（RLCD / Jev）—— 分级调用：不是每条都过，只在高风险时判定
system1:
  verify:
    enabled: true
    # 校验标准：会原样写进 Jev 的问题里
    criteria: "回答必须切题、不得编造、与上下文一致"
    min_score: 0.7          # noul 概率低于此判为不可信，触发带反馈重想
    max_retries: 1          # 重想次数上限（会消耗 max_iterations，默认才 5，别调大）
    trigger: high_risk      # high_risk（动过工具或输出偏长才过）| always | off
    high_risk_chars: 800

  # 够不够的判定 + 判不够时补充上下文
  # 每开一个都要 +1 次 Jev 调用（~1 秒 + 计费），所以按需开、用数据说话
  sufficiency:
    enabled: true
    top_k: 3
    max_rounds: 1     # 补充轮数上限
    supplement_multiplier: 2   # 补充轮放大倍数，不宜大——假命中会被放大成噪音
    max_context_chars: 3000    # 注入 system 的总长上限
  route:
    # 加在请求最前面，开了等于每个请求都 +1 次调用——代价最贵，暂不开
    enabled: false
