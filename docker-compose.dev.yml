services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - openagentic-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn openagentic.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: openagentic
      POSTGRES_USER: openagentic
      POSTGRES_PASSWORD: openagentic
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagentic"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  openagentic-data:
