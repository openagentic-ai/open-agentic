# 服务器巡检
# 跑 uptime / df / free，LLM 解读后飞书告警。
slug: ops.server_health
version: 1
name: 服务器巡检
description: >
  检查服务器负载（uptime）、磁盘（df -h）、内存（free -h），
  LLM 解读异常指标并推飞书告警。触发时传 {{input.target_chat_id}}。
definition:
  nodes:
    - id: input
      type: value
      config:
        value:
          target_chat_id: "{{input.target_chat_id}}"

    - id: check_uptime
      type: tool
      config:
        tool_name: run_command
        arg: "uptime"

    - id: check_disk
      type: tool
      config:
        tool_name: run_command
        arg: "df -h / /data 2>/dev/null || df -h /"

    - id: check_mem
      type: tool
      config:
        tool_name: run_command
        arg: "free -h"

    - id: analyze
      type: llm
      config:
        model: deepseek/deepseek-v4-flash
        system_prompt: >
          你是运维巡检助手。根据 uptime / df / free 输出判断服务器健康状态。
          只报告异常指标（负载 > CPU 核数、磁盘 > 80%、内存 < 10% 可用），
          正常的略过。用中文输出，Markdown 格式。
        prompt: |
          ## 服务器负载
          {{nodes.check_uptime}}

          ## 磁盘
          {{nodes.check_disk}}

          ## 内存
          {{nodes.check_mem}}

          请做健康解读。

    - id: alert_feishu
      type: feishu
      config:
        subcommand: im send
        args:
          - --receive-id
          - "{{nodes.input.target_chat_id}}"
          - --content
          - "{{nodes.analyze}}"

  edges:
    - from: input
      to: check_uptime
    - from: input
      to: check_disk
    - from: input
      to: check_mem
    - from: check_uptime
      to: analyze
    - from: check_disk
      to: analyze
    - from: check_mem
      to: analyze
    - from: analyze
      to: alert_feishu
