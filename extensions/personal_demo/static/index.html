<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人简报 · OpenAgentic</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#203128;font:16px/1.7 system-ui,sans-serif}header,main{max-width:1140px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;border-bottom:1px solid #d5ddd5}a{color:inherit}h1{font-size:38px;letter-spacing:-1px;margin:20px 0 6px}h2{font-size:18px}p{color:#59695c}main{display:grid;grid-template-columns:310px 1fr;gap:24px}.card{background:white;border:1px solid #dce3da;padding:24px;border-radius:16px;margin-bottom:20px}label{display:block;margin:12px 0 5px;font-size:13px;color:#59695c}input,select,textarea,button{font:inherit;width:100%;border:1px solid #ccd7cc;border-radius:8px;padding:10px;background:white}textarea{resize:vertical}button{background:#294b37;color:white;cursor:pointer;margin-top:12px}button:disabled{opacity:.5;cursor:wait}.tag{border:1px solid #cad8c8;padding:4px 12px;border-radius:30px;font-size:12px}.muted{font-size:12px;color:#667568}#report{white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#695429}li{overflow-wrap:anywhere}details{margin-top:20px}summary{cursor:pointer}#meta{font-size:12px;color:#657567}@media(max-width:750px){main{grid-template-columns:1fr}h1{font-size:29px}header,main{padding:18px}}</style>
<header><strong>◎ OpenAgentic</strong><span class="tag">个人助手 · 验证原型</span></header>
<main><aside><section class="card"><h2>模型由你选择</h2><form id="model-form"><label for="mode">运行方式</label><select id="mode"><option value="local">本地模型</option><option value="api">自带 API key</option></select><label for="base">OpenAI 兼容地址</label><input id="base" required><label for="model">模型名称</label><input id="model" required placeholder="openai/模型名称"><label for="key">API key（仅保留在本次服务进程）</label><input id="key" type="password" autocomplete="off" placeholder="本地服务无鉴权时可留空"><button>应用模型配置</button></form><p id="boundary" class="muted"></p></section><section class="card"><h2>授权资料</h2><ul id="notes"></ul><p class="muted">仅读取启动时指定文件夹的 Markdown / TXT；不会修改原文件。</p><label for="preference">记住我的展示偏好</label><textarea id="preference" rows="3" placeholder="例如：先列有截止日期的事项，用简短中文。"></textarea><button id="save-pref">保存偏好</button></section></aside>
<div><span class="tag">第一个场景 / PERSONAL BRIEF</span><h1>散落的笔记，<br>变成下一步行动。</h1><p>读取资料 → 整理待办 → 保留来源 → 保存简报</p><section class="card"><label for="request">这次想整理什么？</label><textarea id="request" rows="3">整理全部笔记，告诉我汇报前要准备什么，以及其他个人待办。标注来源，别把待办说成已完成。</textarea><button id="run">生成我的简报</button><p id="status" role="status" aria-live="polite">正在读取配置…</p></section><section class="card"><h2>我的简报</h2><p id="meta"></p><div id="report">生成后的简报会保存在这台机器上，再次打开可继续查看。</div><details><summary>查看本次资料读取记录</summary><ul id="events"></ul></details></section><p class="muted">当前验证笔记整理与结果持久化。日历、后台提醒、跨应用执行尚未接入。模型生成内容请结合来源核对。</p></div></main>
<script>
const $=id=>document.getElementById(id);let activeMode='local';
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(typeof b.detail==='string'?b.detail:'输入无效，请检查字段');return b}
function status(s){$('status').textContent=s}
function show(r){if(!r)return;$('report').textContent=r.content;$('meta').textContent=`${r.mode==='local'?'本地模型':'云端 API'} · ${r.model} · ${r.seconds} 秒 · ${new Date(r.created_at).toLocaleString()}`;$('events').replaceChildren(...r.events.map(e=>{const li=document.createElement('li');li.textContent=e.tool+' '+JSON.stringify(e.arguments);return li}))}
async function load(){const s=await api('/api/state');activeMode=s.mode;$('mode').value=s.mode;$('base').value=s.api_base;$('model').value=s.model;$('preference').value=s.preferences;$('key').placeholder=s.key_configured?'已配置；修改模型时请重新输入':'本地服务无鉴权时可留空';$('boundary').textContent=s.mode==='local'?'当前：本机推理。调用失败不会切换到云端。':'当前：所读取的笔记与偏好会发送到你配置的 API 服务。';$('notes').replaceChildren(...s.notes.map(n=>{const li=document.createElement('li');li.textContent=n;return li}));show(s.report)}
$('model-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/model',{mode:$('mode').value,api_base:$('base').value,model:$('model').value,api_key:$('key').value});$('key').value='';await load();status('模型配置已应用。')}catch(e){status(e.message)}};
$('save-pref').onclick=async()=>{try{await api('/api/preferences',{text:$('preference').value});status('偏好已保存，下次生成时使用。')}catch(e){status(e.message)}};
$('run').onclick=async()=>{if(activeMode==='api'&&!confirm('将把这些笔记及偏好发送给当前配置的 API 服务，继续吗？'))return;$('run').disabled=true;status('正在读取笔记并生成简报，请稍候…');try{show(await api('/api/run',{request:$('request').value}));status('简报已生成并保存。刷新页面可验证。')}catch(e){status(e.message)}finally{$('run').disabled=false}};
load().then(()=>status('准备就绪。示例笔记均为虚构资料。')).catch(e=>status(e.message));
</script></html>
